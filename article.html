<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文章 · 姜sir笔记</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="notes">
<div class="read-progress" id="rp"></div>
<div id="article-root"></div>

<script src="assets/data.js?v=20261020c"></script>
<script src="assets/articles.js?v=20261020c"></script>
<script src="assets/layout.js"></script>
<script>
const postId = new URLSearchParams(location.search).get("id") || "";
const post = SITE.posts.find(p => p.id === postId);
const root = document.getElementById("article-root");

if (!post) {
  root.innerHTML = `
    <div class="container" style="padding:120px 24px;text-align:center">
      <h1 style="font-size:28px;font-weight:600;margin-bottom:12px">文章未找到</h1>
      <p style="color:var(--text-2);margin-bottom:24px">请检查链接是否正确，或返回知识库浏览全部文章。</p>
      <a href="notes.html" class="btn btn-primary">返回知识库</a>
    </div>`;
} else {
  document.title = post.title + " · 姜sir笔记";
  const catInfo = catOf(post.cat);
  const allIds = SITE.posts.map(p => p.id);
  const idx = allIds.indexOf(postId);
  const prev = idx < allIds.length - 1 ? SITE.posts.find(p => p.id === allIds[idx + 1]) : null;
  const next = idx > 0 ? SITE.posts.find(p => p.id === allIds[idx - 1]) : null;

  const dateStr = post.date.replace(/(\d{4})-(\d{2})-(\d{2})/, "$1 年 $2 月 $3 日").replace(/ 年 0/," 年 ").replace(/ 月 0/," 月 ");

  let bodyHTML = "";
  if (post.id === "enterprise-kb") {
    bodyHTML = getRAGContent();
  } else if (window.ARTICLE_CONTENT && window.ARTICLE_CONTENT[post.id]) {
    bodyHTML = window.ARTICLE_CONTENT[post.id];
  } else {
    bodyHTML = getGenericContent(post);
  }

  root.innerHTML = `
<div class="apple-reading">
  <nav class="breadcrumb" style="justify-content:center">
    <a href="index.html">首页</a><span class="bc-chev"></span>
    <a href="notes.html">知识库</a><span class="bc-chev"></span>
    <a href="notes.html?cat=${post.cat}">${catInfo.name}</a><span class="bc-chev"></span>
    <span>${post.sub}</span>
  </nav>

  <h1 class="article-title" style="text-align:center">${post.title}</h1>
  <div class="article-meta" style="justify-content:center">
    <span class="author"><span class="avatar">姜</span>姜sir</span>
    <span class="m" data-i="cal">${dateStr}</span>
    <span class="m" data-i="clock">约 ${post.read} 分钟</span>
    <span class="post-tags">${post.tags.map(t => `<a class="tag" href="notes.html?tag=${t}">${t}</a>`).join("")}</span>
  </div>

  ${bodyHTML}

  <div class="article-end">
    <div class="end-actions">
      <div class="post-tags">${post.tags.map(t => `<span class="tag">${t}</span>`).join("")}</div>
      <button class="btn btn-ghost" id="copy-link" style="height:36px;font-size:13px"><span data-i2="link" style="display:inline-flex"></span>复制链接</button>
    </div>
    <div class="pager">
      ${prev ? `<a class="card hover-lift" href="article.html?id=${prev.id}"><small>← 上一篇</small><b>${prev.title}</b></a>` : '<div></div>'}
      ${next ? `<a class="card hover-lift" href="article.html?id=${next.id}"><small>下一篇 →</small><b>${next.title}</b></a>` : '<div></div>'}
    </div>
  </div>
</div>

<div class="apple-toc-bar" id="toc-bar">
  <span class="progress-text"><b id="pct">0%</b></span>
  <button class="toc-top-btn" id="top-btn" title="回到顶部">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 15l-6-6-6 6"/></svg>
  </button>
</div>`;

  document.querySelectorAll("[data-i]").forEach(e => e.insertAdjacentHTML("afterbegin", ICON[e.dataset.i]));
  document.querySelectorAll("[data-i2]").forEach(e => e.innerHTML = ICON[e.dataset.i2]);
  document.querySelectorAll(".bc-chev").forEach(e => e.outerHTML = ICON.chev);

  document.getElementById("copy-link").onclick = e => { navigator.clipboard?.writeText(location.href); e.currentTarget.lastChild.textContent = "已复制"; };

  document.getElementById("top-btn").onclick = () => scrollTo({ top: 0, behavior: "smooth" });

  const art = document.querySelector(".apple-reading");
  addEventListener("scroll", () => {
    const total = art.offsetTop + art.offsetHeight - innerHeight;
    const pct = Math.max(0, Math.min(100, Math.round(scrollY / total * 100)));
    document.getElementById("rp").style.width = pct + "%";
    document.getElementById("pct").textContent = pct + "%";
  }, { passive: true });
}

function getGenericContent(post) {
  return `
  <div class="summary-box">
    <h4><span data-i2="bulb"></span>摘要</h4>
    <p style="margin:0;color:var(--text)">${post.summary}</p>
  </div>
  <div class="prose">
    <div class="callout"><div class="ci"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></svg></div><div><b>全文撰写中</b><p>这篇文章的完整内容正在撰写中，敬请期待。你可以先看看<a href="article.html?id=enterprise-kb" style="color:var(--brand)">企业 RAG 知识库 20 问</a>——已完成的完整专题。</p></div></div>
  </div>`;
}

function getRAGContent() {
  return `
  <div class="summary-box">
    <h4><span data-i2="bulb"></span>读完你会得到</h4>
    <ul>
      <li>一条从文档上传到答案生成的完整数据流，以及每个环节的选型建议</li>
      <li>检索精度从 78% 提升到 94% 的组合拳：混合检索 + Rerank</li>
      <li>上线后的缓存、评估、监控、降级与灰度方案</li>
    </ul>
    <div class="flow"><span>上传</span><i>→</i><span>解析</span><i>→</i><span>分块</span><i>→</i><span>向量化</span><i>→</i><span>入库</span><i>→</i><span>检索</span><i>→</i><span>生成</span></div>
  </div>
  <div class="prose">
<div class="stage">01 · 准备阶段</div>
<h2 id="s0"><span class="num">00</span><span>你的场景真的需要 RAG 吗？</span></h2>
<p>知识更新频繁、需要溯源、数据量大、不能给第三方 → 用 RAG。让模型学写作风格 → 用微调。</p>
<div class="callout"><div class="ci"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></svg></div><div><b>经验之谈</b><p>很多人一上来就问"用 Milvus 还是 Qdrant"。错了，第一个问题永远是"需不需要 RAG"。选错方向，后面全白干。</p></div></div>
<h2 id="s1"><span class="num">01</span><span>先看全局架构，还是先写代码？</span></h2>
<p>先看全局。完整数据流：<strong>文档上传 → 解析 → 分块 → 向量化 → 入库 → 检索 → 生成</strong>。</p>
<div class="callout"><div class="ci"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></svg></div><div><b>经验之谈</b><p>别一上来就搞微服务。单体 FastAPI + 向量数据库 + Redis，足够扛到 100 并发。等真正遇到瓶颈了再拆。</p></div></div>
<div class="stage">02 · 数据处理</div>
<h2 id="s2"><span class="num">02</span><span>PDF 解析该走哪条路？</span></h2>
<p>干净 PDF → PyMuPDF（免费快速）。扫描件 → PaddleOCR（中文最好）。高价值文档 → 多模态大模型（0.01-0.05 元/页）。</p>
<div class="callout"><div class="ci"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></svg></div><div><b>经验之谈</b><p>路线 1 先跑通，不行再上路线 2，只有合同财报才用路线 3。<strong>表格解析别自己写正则</strong>，直接用多模态模型识别成 Markdown。</p></div></div>
<h2 id="s3"><span class="num">03</span><span>分块用 512 tokens 够不够？</span></h2>
<p>不够。通用文档建议 <strong>800 tokens、overlap 100</strong>。太小缺上下文，太大检索不精确。FAQ 不切分，一个 QA 对一个 chunk。</p>
<div class="callout"><div class="ci"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></svg></div><div><b>经验之谈</b><p>试试父子块检索——索引小块 200 tokens（精确匹配），返回大块 1000 tokens（完整上下文）。精度和回答质量同时提升。</p></div></div>
<h2 id="s4"><span class="num">04</span><span>元数据到底要不要认真填？</span></h2>
<p>必须。每个 chunk 带上 <strong>document_id、source、department、access_level、created_at</strong>。这是检索精度的隐形加速器。</p>
<div class="callout"><div class="ci"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></svg></div><div><b>经验之谈</b><p>好的元数据能<strong>直接过滤 80% 无关文档</strong>，比优化向量还有效。用 pre-filter 不是 post-filter。access_level 必须从认证信息获取，不能从用户输入获取。</p></div></div>
<h2 id="s5"><span class="num">05</span><span>Embedding 模型选哪个？</span></h2>
<p>中文场景，<strong>BGE-M3 是版本答案</strong>。智源出品，开源免费，支持稠密+稀疏+多向量三种模式，最高 8192 token 输入。</p>
<div class="callout"><div class="ci"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></svg></div><div><b>经验之谈</b><p>一张 T4 显卡就够跑，200 句/秒，零 API 成本。什么时候用 OpenAI？没 GPU、需要多语言统一向量空间、不在乎钱。</p></div></div>
<h2 id="s6"><span class="num">06</span><span>向量数据库选 Milvus 还是 Qdrant？</span></h2>
<p>中小规模（&lt;50 万）→ Qdrant，Rust 写的，单二进制部署。大规模（&gt;50 万）→ Milvus，性能天花板高。原型 → Chroma。</p>
<div class="callout"><div class="ci"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></svg></div><div><b>经验之谈</b><p>向量数据库<strong>迁移成本极高</strong>。一开始就选能扛住未来 3 年数据量的方案，别等数据量上来了再换。</p></div></div>
<div class="stage">03 · 检索与生成</div>
<h2 id="s7"><span class="num">07</span><span>用户问"年假怎么算"，怎么检索到"年休假计算规则"？</span></h2>
<p>做 Query 预处理：同义词扩展、HyDE、Multi-Query、Step-Back。</p>
<div class="callout"><div class="ci"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></svg></div><div><b>经验之谈</b><p><strong>多轮对话必须把历史拼进当前 query 再改写</strong>，不然"那试用期呢"这种追问必挂。</p></div></div>
<h2 id="s8"><span class="num">08</span><span>只用向量检索行不行？</span></h2>
<p>不行。必须混合检索：向量 + BM25 + RRF 融合。再加 Rerank 精排。</p>
<div class="callout"><div class="ci"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></svg></div><div><b>经验之谈</b><p>混合检索比纯向量 +10~15%。再加 Rerank，<strong>从 78% 干到 94%</strong>。</p></div></div>
<h2 id="s9"><span class="num">09</span><span>Prompt 怎么写才不会让模型瞎编？</span></h2>
<p>四要素：有答案就回答+标注来源、没答案就说"未找到"、禁止编造、简洁不啰嗦。</p>
<div class="callout"><div class="ci"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></svg></div><div><b>经验之谈</b><p>"不知道"比"瞎编"好一万倍。一个瞎编答案，用户对整个系统失去信任。</p></div></div>
<h2 id="s10"><span class="num">10</span><span>同样的问题一天被问 50 次，每次都走完整 RAG？</span></h2>
<p>做三级缓存。L1 精确匹配 → L2 语义缓存 → L3 完整 RAG。</p>
<div class="callout"><div class="ci"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></svg></div><div><b>经验之谈</b><p>上线语义缓存后，LLM 调用量减少 40%，平均响应从 3.2s 降到 1.1s。</p></div></div>
<div class="stage">04 · 上线运营</div>
<h2 id="s11"><span class="num">11</span><span>上线了不评估行不行？</span></h2>
<p>不行。检索看 Recall / Precision / MRR，生成看 Faithfulness / Relevance / Completeness。</p>
<div class="callout"><div class="ci"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></svg></div><div><b>经验之谈</b><p>手动评估（每周 20 个 case）+ 自动评估（每天全量，用 RAGAS）。</p></div></div>
<h2 id="s12"><span class="num">12</span><span>老板问"到底要花多少钱"？</span></h2>
<p>小规模 ~$100/月，中规模 ~$750/月，大规模 ~$4,500/月。</p>
<div class="callout"><div class="ci"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></svg></div><div><b>经验之谈</b><p>省钱五招：语义缓存、mini 模型、本地 Embedding/Rerank、批量向量化、上下文压缩。</p></div></div>
<h2 id="s13"><span class="num">13</span><span>上线之后怎么监控？</span></h2>
<p>接 LangFuse。每次查询的完整链路每个环节耗时、输入输出全可追踪。</p>
<div class="callout"><div class="ci"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></svg></div><div><b>经验之谈</b><p>告警三条线：检索延迟 P95 > 2s、LLM 失败率 > 1%、命中率 < 80%。</p></div></div>
<h2 id="s14"><span class="num">14</span><span>权限控制和防注入怎么做？</span></h2>
<p>每个 chunk 打权限标签，检索时 pre-filter。系统 prompt 和用户输入严格分离。</p>
<div class="callout"><div class="ci"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></svg></div><div><b>经验之谈</b><p>权限模型提前设计，别等上线再补。</p></div></div>
<div class="stage">05 · 开发细节</div>
<h2 id="s15"><span class="num">15</span><span>10 万文档怎么高效入库？</span></h2>
<p>批量处理，多线程并发。Embedding batching，向量数据库 bulk upsert。</p>
<div class="callout"><div class="ci"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></svg></div><div><b>经验之谈</b><p>先做增量导入，记录进度断点，中断了能从断点续传。</p></div></div>
<h2 id="s16"><span class="num">16</span><span>文档更新了，旧 chunk 怎么办？</span></h2>
<p>每个 chunk 带 document_id 和 version。更新时删旧写新。</p>
<div class="callout"><div class="ci"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></svg></div><div><b>经验之谈</b><p>别忘了同步清除语义缓存。</p></div></div>
<h2 id="s17"><span class="num">17</span><span>检索结果不好，怎么排查？</span></h2>
<p>分三层：Query 层 → 检索层 → 生成层。</p>
<div class="callout"><div class="ci"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></svg></div><div><b>经验之谈</b><p>80% 的问题出在检索层，不是生成层。别一上来就调 prompt。</p></div></div>
<h2 id="s18"><span class="num">18</span><span>不同文档里有重复内容怎么办？</span></h2>
<p>入库前去重。用 hash 或 Embedding 相似度 >0.98 判重。</p>
<div class="callout"><div class="ci"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></svg></div><div><b>经验之谈</b><p>去重直接影响检索精度。</p></div></div>
<h2 id="s19"><span class="num">19</span><span>LLM API 限流或挂了怎么办？</span></h2>
<p>降级策略：主模型 → 备用模型 → 返回"系统繁忙"。用 tenacity 重试。</p>
<div class="callout"><div class="ci"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></svg></div><div><b>经验之谈</b><p>一定要设超时（建议 30s），不然一个慢请求卡住整个线程池。</p></div></div>
<h2 id="s20"><span class="num">20</span><span>新策略怎么安全上线？</span></h2>
<p>灰度发布。10% → 50% → 100%。</p>
