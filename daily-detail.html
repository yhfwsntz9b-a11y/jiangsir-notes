<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>科技日报详情 · 姜sir笔记</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="daily">
<div id="app" style="max-width:780px;margin:0 auto;padding:60px 20px;text-align:center">
  <div class="card empty-state" style="padding:60px 20px">
    <h2>正在加载日报...</h2>
    <p>如果页面没有自动跳转，请点击下方链接。</p>
    <p id="fallback-link" style="margin-top:20px"></p>
    <a href="daily.html" class="btn btn-primary" style="margin-top:20px">返回日报列表</a>
  </div>
</div>
<script src="assets/data.js?v=20261030"></script>
<script>
  const dateId = new URLSearchParams(location.search).get("date") || "";
  const daily = SITE.dailies.find(d => d.date === dateId);

  if (!daily) {
    document.getElementById("app").innerHTML = `
      <div class="card empty-state" style="padding:60px 20px">
        <h2>日报未找到</h2>
        <p>请检查链接是否正确，或返回日报列表浏览全部期数。</p>
        <a href="daily.html" class="btn btn-primary" style="margin-top:20px">返回日报列表</a>
      </div>`;
  } else {
    const target = `daily/${daily.date}.html`;
    document.getElementById("fallback-link").innerHTML = `<a href="${target}" class="btn btn-primary">打开 ${daily.date} 科技日报</a>`;
    location.replace(target);
  }
</script>
</body>
</html>
